<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable sur Moovini</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/images/favicon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="/images/symbole.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  /* Page d'erreur servie par GitHub Pages à n'importe quelle adresse : chemins absolus. */
  @font-face {
    font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 500 800; font-display: swap;
    src: url(/fonts/plus-jakarta-sans-latin.woff2) format('woff2');
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; text-align: center;
    background: #14292E; color: #FAF7F1; font-family: 'Plus Jakarta Sans', -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  img { width: 72px; height: auto; margin: 0 auto 28px; display: block; }
  h1 { font-size: clamp(1.7rem, 6vw, 2.4rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.1; }
  h1 em { font-style: normal; color: #EA8069; }
  p { margin-top: 14px; color: #D5E3E2; font-size: 1.05rem; line-height: 1.6; }
  a.retour { display: inline-block; margin-top: 28px; padding: 14px 26px; border-radius: 999px; background: #C4553D; color: #fff; font-weight: 800; text-decoration: none; }
  a.retour:hover { background: #B04A33; }
  a:focus-visible { outline: 2px solid #45B9AD; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <img src="/images/logo-creme.svg" alt="Moovini" width="104" height="100">
  <h1>Cette page fait une pause<em>.</em></h1>
  <p>L'adresse demandée n'existe pas, ou plus.</p>
  <a class="retour" href="/">Revenir à l'accueil</a>
</main>
</body>
</html>
